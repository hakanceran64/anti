[workspace]
members = [
    "crates/kernel",
    "crates/core", 
    "crates/service",
    "crates/gui",
    "crates/cli"
]
resolver = "2"

[workspace.package]
name = "hadron-antivirus"
version = "1.0.0"
authors = ["HADRON Security Team"]
description = "HADRON - Advanced Windows Antivirus Protection"
license = "Proprietary"
repository = "https://github.com/hadron-security/hadron-antivirus"
homepage = "https://hadron-security.com"
documentation = "https://docs.hadron-security.com"
keywords = ["antivirus", "security", "windows", "malware", "protection"]
categories = ["security", "system-tools"]
edition = "2021"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Crypto
aes = "0.8"
sha2 = "0.10"
ring = "0.17"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Configuration
config = "0.14"

# Testing
tempfile = "3.0"

# YARA engine
yara = "0.20"

# Performance and benchmarking
criterion = "0.5"

# Hash algorithms
md5 = "0.7"
sha1 = "0.10"

# Windows-specific dependencies (defined in individual crates)
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry"
] }
winapi = { version = "0.3", features = [
    "jobapi2",
    "winnt",
    "handleapi",
    "processthreadsapi",
    "minwindef"
] }